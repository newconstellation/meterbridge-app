name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Zip app
        run: cd build && ditto -c -k --keepParent "Meter Bridge.app" MeterBridge.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MeterBridge-app
          path: build/MeterBridge.zip
